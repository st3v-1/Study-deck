<!doctype html>
<html><head><meta charset="utf-8"><title>Layout preview</title>
<style>
  html,body{margin:0;background:#0e0d12;overflow:hidden}
  iframe{border:0;display:block;transform-origin:top left}
</style></head>
<body>
<iframe id="f" src="../newtab.html?layout-preview=1"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const w = Number(params.get("w") || 1440);
  const h = Number(params.get("h") || 900);
  const f = document.getElementById("f");
  f.src = "../newtab.html?layout-preview=1&v=" + Date.now();
  f.style.width = w + "px";
  f.style.height = h + "px";
  document.documentElement.style.width = w + "px";
  document.documentElement.style.height = h + "px";
</script>
</body></html>
